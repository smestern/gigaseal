    <link rel="stylesheet" href="assets/css/styles.css">

<body class="fs-6 fw-lighter focus-ring focus-ring-primary">
    <div class="container-fluid d-flex flex-column flex-grow-1 flex-shrink-1 flex-fill justify-content-center align-items-center align-content-center align-items-xxl-center"

            <div class="col-md">

                                <h6 class="text-muted card-subtitle mb-2" id="db_subtitle">Subtitle</h6>
                                <p class="card-text" id="db_desc">Nullam id dolor id nibh ultricies vehicula ut id elit.
                                    Cras justo odio, dapibus ac facilisis in, egestas eget quam. Donec id elit non mi
                                    porta gravida at eget metus.</p><a class="card-link" href="#">Link</a><a
                                    class="card-link" href="#">Link</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="card card-base">
                            <div class="card-body">
                                <h6 class="text-muted card-subtitle" id="Label-Viz">Label Visualized</h6>
                                <div id="umap-drop-menu"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row visually-hidden" id="dataset-select">
                    <div class="col">
                        <div class="card card-base">
                            <div class="card-body">
                                <h6 class="text-muted card-subtitle" id="Label-Viz-1">Datasets Visualized</h6>
                                <div id="dataset-drop-menu"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-10" id="plot-col">
                <div class="row">
                    <div class="col">
                        <div class="card card-base" id="embed_card">
                            <div class="card-body">
                                <h4 class="card-title">Title</h4>
                                <div id="graphDiv_scatter"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col col-para">
                        <div class="card card-base" id="para_card">
                            <div class="card-body">
                                <h4 class="card-title">Title</h4>
                                <div id="graphDiv_parallel"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row" id="table-toolbar-row">
            <div class="col">
                <div class="card card-base d-none" id="table-toolbar">
                    <div class="card-body">
                        <input type="search" class="form-control form-control-sm" id="table-search"
                            placeholder="Search ID, dandiset, species, region..." aria-label="Search cells">
                        <label class="text-muted" for="table-sort">Sort by</label>
                        <select class="form-select form-select-sm" id="table-sort">
                            <option value="">Default order</option>
                        </select>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="table-sort-dir"
                            title="Toggle sort direction">&uarr; asc</button>
                        <div id="table-status"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row" id="table-row">
            <table id="table" data-toggle="table" data-detail-view="false" data-show-header="false"
                data-show-export="false" data-show-columns="false" data-search="false" data-resizable="true"
                data-pagination="true" data-page-size="50" data-page-list="[25, 50, 100, 200]"
                data-search-formatter="false" data-classes="table table-responsive table-card-alt">
                <thead>
                    <tr>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
    <div>
        <script>
            function plotFormatterDummy(value, row, index, field) {
                return '<div id="graphDiv_' + row['ID'] + field + '"></div>';
            }
            function valFormatter(value, row, index, field) {
                //make a nice text for the value
                html = []
                html.push('<div class="col">')
                html.push('<div class="feat-title">' + field + '</div>')
                html.push('<span class="feat-value">' + value + '</span>')
                html.push('</div>')
                return html.join('')

            }
            function ephysFormatterDummy(value, row, index, field) {
                return '<div id="table_' + row['ID'] + '"></div>';
            }
            function linkFormatterDummy(value, row, index, field) {
                return '<div id="link_' + row['ID'] + '" class="file-link"></div>';
            }

            // ---- card layout (webviz_cfg.table_style == "cards", settings come from data.js) ----
            function escapeHtml(value) {
                return String(value).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }
            function isMissingValue(v) {
                return v === null || v === undefined || v === '' || v === 'nan' || (typeof v === 'number' && isNaN(v));
            }
            function shortCellID(id) {
                var parts = String(id).split('/');
                return parts.length > 1 ? parts[0] + ' / ' + parts[parts.length - 1] : String(id);
            }
            function traceUrl(id, suffix) {
                var prefix = String(id).split('/')[0];
                var base = webviz_cfg.trace_base_overrides[prefix] || webviz_cfg.trace_base_url;
                return base + id + suffix;
            }
            function traceMissing(img) {
                var div = document.createElement('div');
                div.className = 'trace-missing';
                div.textContent = (img.alt === 'FI' ? 'FI curve' : 'Trace') + ' not available';
                img.replaceWith(div);
            }
            function formatFeature(value, spec) {
                if (isMissingValue(value) || typeof value !== 'number') {
                    return isMissingValue(value) ? '\u2014' : escapeHtml(value);
                }
                var v = spec.log10 ? Math.pow(10, value) : value;
                var txt = Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : String(Number(v.toPrecision(3)));
                return escapeHtml(txt) + (spec.unit ? ' <span class="feat-unit">' + escapeHtml(spec.unit) + '</span>' : '');
            }
            function cardFormatter(value, row, index, field) {
                var id = row['ID'];
                var title = row[webviz_cfg.title_col] !== undefined ? row[webviz_cfg.title_col] : id;
                var parts = String(title).split('/');
                var html = [];
                html.push('<div class="cell-card" data-id="' + escapeHtml(id) + '">');

                //header: ID, badges, links
                html.push('<div class="cell-card-header">');
                html.push('<div class="cell-title" title="' + escapeHtml(title) + '">');
                if (parts.length > 1) {
                    html.push('<span class="cell-id-prefix">' + escapeHtml(parts[0]) + '</span>');
                }
                html.push('<span class="cell-id-name">' + escapeHtml(parts[parts.length - 1]) + '</span></div>');
                html.push('<div class="cell-badges">');
                webviz_cfg.card_badges.forEach(function (col) {
                    if (!isMissingValue(row[col])) {
                        html.push('<span class="cell-badge" title="' + escapeHtml(col) + '">' + escapeHtml(row[col]) + '</span>');
                    }
                });
                html.push('</div><div class="cell-links">');
                webviz_cfg.links.forEach(function (col) {
                    if (!isMissingValue(row[col])) {
                        html.push('<a class="btn btn-sm btn-outline-secondary" target="_blank" rel="noopener" href="' +
                            escapeHtml(row[col]) + '">' + escapeHtml(col) + '</a>');
                    }
                });
                html.push('<a class="btn btn-sm btn-link cell-share" title="Link to this cell" href="#cell=' +
                    encodeURIComponent(id) + '">#</a>');
                html.push('</div></div>');

                //body: trace | features | FI
                html.push('<div class="cell-card-body">');
                html.push('<div class="cell-trace"><img loading="lazy" alt="Traces" onerror="traceMissing(this)" src="' +
                    escapeHtml(traceUrl(id, '.svg')) + '"></div>');
                html.push('<dl class="feat-grid">');
                webviz_cfg.card_features.forEach(function (f) {
                    var spec = typeof f === 'string' ? { col: f } : f;
                    html.push('<dt>' + escapeHtml(spec.label || spec.col) + '</dt><dd>' + formatFeature(row[spec.col], spec) + '</dd>');
                });
                html.push('</dl>');
                html.push('<div class="cell-fi"><img loading="lazy" alt="FI" onerror="traceMissing(this)" src="' +
                    escapeHtml(traceUrl(id, '_FI.svg')) + '"></div>');
                html.push('</div></div>');
                return html.join('');
            }
        </script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
        <script src="assets/bootstrap/js/bootstrap.min.js"></script>
        <script src="https://cdn.plot.ly/plotly-3.3.0.min.js" charset="utf-8"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/jquery-resizable-columns@0.2.3/dist/jquery.resizableColumns.min.js"></script>
        <script src="https://unpkg.com/bootstrap-table@1.22.4/dist/bootstrap-table.min.js"></script>

        <script src="./assets/data.js"></script>
        <!-- Load common utilities FIRST, then mode-specific template -->
        <script src="./assets/template.js"></script>

</body>

</html>
